# 开发环境基础设施
# 使用方法: docker compose up -d

services:
  postgres:
    image: postgres:15
    container_name: smart-travel-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_travel
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: smart-travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
